<script>
  (() => {
    const root = document.getElementById('welcare-navigation');
    if (!root || root.dataset.navigationReady === 'true') return;
    root.dataset.navigationReady = 'true';

    const overlay = root.querySelector('#drawerOverlay');
    const drawer = root.querySelector('#siteDrawer');
    const closeButton = root.querySelector('#menuClose');
    const openButton = document.getElementById('menuOpen');
    if (!overlay || !drawer || !closeButton || !openButton) return;

    let previousFocus = null;
    const openDrawer = () => {
      previousFocus = document.activeElement;
      overlay.classList.add('is-open');
      drawer.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');
      drawer.setAttribute('aria-hidden', 'false');
      drawer.removeAttribute('inert');
      document.body.style.overflow = 'hidden';
      openButton.setAttribute('aria-expanded', 'true');
      closeButton.focus();
    };
    const closeDrawer = () => {
      overlay.classList.remove('is-open');
      drawer.classList.remove('is-open');
      overlay.setAttribute('aria-hidden', 'true');
      drawer.setAttribute('aria-hidden', 'true');
      drawer.setAttribute('inert', '');
      document.body.style.overflow = '';
      openButton.setAttribute('aria-expanded', 'false');
      if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
    };

    openButton.addEventListener('click', openDrawer);
    closeButton.addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);
    drawer.addEventListener('click', event => event.stopPropagation());
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && drawer.classList.contains('is-open')) closeDrawer();
      if (event.key === 'Tab' && drawer.classList.contains('is-open')) {
        const focusable = [...drawer.querySelectorAll('a[href], button:not([disabled])')];
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    drawer.querySelectorAll('[data-nav-target]').forEach(link => {
      link.addEventListener('click', event => {
        const targetId = link.getAttribute('data-nav-target');
        const target = document.getElementById(targetId);
        if (!target) return;
        event.preventDefault();
        closeDrawer();
        history.replaceState(null, '', `#${targetId}`);
        target.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      });
    });
  })();
</script>
